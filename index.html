<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inglês Pro - Glass Edition</title>
  
<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #1a2a6c);
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
    color: white;
    text-align: center;
    padding: 20px;
    margin: 0;
    min-height: 100vh;
  }

  @keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .game-box {
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 20px;
    padding: 30px;
    max-width: 420px;
    margin: auto;
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
  }

  /* MODAL DE RESULTADOS (MENU DE RESPOSTAS) */
  #modalResultados {
    display: none;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 1000;
    width: 90%;
    max-width: 400px;
    background: rgba(15, 32, 39, 0.98);
    border: 2px solid #00c3ff;
    border-radius: 25px;
    padding: 25px;
    box-shadow: 0 0 50px rgba(0,0,0,0.9);
  }

  .resumo-lista {
    text-align: left;
    max-height: 250px;
    overflow-y: auto;
    margin: 15px 0;
    padding: 15px;
    background: rgba(255,255,255,0.05);
    border-radius: 12px;
    font-size: 0.9rem;
    line-height: 1.6;
  }

  /* BOTÕES ORIGINAIS */
  button {
    padding: 12px;
    font-size: 1rem;
    cursor: pointer;
    background-color: #00c3ff;
    color: white;
    margin: 8px;
    width: 100%;
    max-width: 260px;
    font-weight: bold;
    border: none;
    border-bottom: 4px solid #0099cc;
    border-radius: 12px;
    transition: all 0.1s ease;
  }

  button:active { border-bottom: 0; transform: translateY(4px); }
  
  .btn-proximo { background-color: #2ecc71; border-bottom-color: #27ae60; margin-top: 15px; }

  .btn-dica {
    background: transparent !important; color: #ffc107 !important;
    border: 2px dashed #ffc107 !important; border-bottom: 2px dashed #ffc107 !important;
  }

  .moedas-container { color: #ffd700; font-weight: bold; margin-bottom: 10px; }
  input[type="text"] { padding: 12px; width: 80%; border-radius: 10px; border: none; margin: 10px 0; text-align: center; font-size: 1rem; }
  .feedback { margin-top: 10px; font-weight: bold; min-height: 1.5em; }
  
  .shake { animation: shake 0.4s; }
  @keyframes shake { 0%, 100% {transform: translateX(0);} 25% {transform: translateX(-8px);} 75% {transform: translateX(8px);} }
</style>
</head>
<body>

  <h1>LEARN ENGLISH</h1>
  
  <div id="mapaNiveis" style="margin-bottom: 20px; font-size: 1.2rem;"></div>
  
  <div class="game-box" id="gameBox">
    <div class="moedas-container" id="moedasDisplay">🪙 Moedas: 5</div>
    <div class="vidas" id="vidasDisplay">❤️ ❤️ ❤️</div>
    
    <div class="palavra-container">
      <h2 id="wordDisplay">...</h2>
      <button style="width:auto; background:#ffc107; color:#333; border-bottom-color:#c79400;" onclick="falarPalavra()">🔊 Ouvir</button>
    </div>

    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedbackDisplay"></div>
    
    <div class="score" id="scoreDisplay">Pontos: 0</div>
    <div class="level" id="levelDisplay">Nível: 1</div>

    <button class="btn-dica" id="btnDica" onclick="revelarResposta()">💡 Resposta Automática (3 🪙)</button>
    <br>
    <button onclick="resetarJogo()" style="background:none; border:none; color:#ff6b6b; text-decoration:underline; font-size:0.8rem; cursor:pointer;">Reiniciar Tudo</button>
  </div>

  <div id="modalResultados">
    <h2 style="color: #2ecc71;">Nível Concluído!</h2>
    <div class="resumo-lista" id="resumoConteudo"></div>
    <p id="infoFaltam" style="font-weight: bold;"></p>
    <button class="btn-proximo" onclick="irParaProximoNivel()">Ir para o Próximo Nível ➔</button>
  </div>

  <script>
    // --- TODOS OS SEUS NÍVEIS ORIGINAIS ---
    const nivel1 = [ { pt: "casa", en: "house" }, { pt: "gato", en: "cat" }, { pt: "livro", en: "book" }, { pt: "maçã", en: "apple" }, { pt: "carro", en: "car" }, { pt: "sol", en: "sun" }, { pt: "água", en: "water" }, { pt: "mesa", en: "table" }];
    const nivel2 = [ { pt: "janela", en: "window" }, { pt: "cachorro", en: "dog" }, { pt: "telefone", en: "phone" }, { pt: "estrada", en: "road" }, { pt: "caneta", en: "pen" }, { pt: "verde", en: "green" }, { pt: "fruta", en: "fruit" }, { pt: "noite", en: "night" }];
    const nivel3 = [ { pt: "conhecimento", en: "knowledge" }, { pt: "pensamento", en: "thought" }, { pt: "esperança", en: "hope" }, { pt: "desafio", en: "challenge" }, { pt: "compreensão", en: "understanding" }, { pt: "liberdade", en: "freedom" }, { pt: "decisão", en: "decision" }, { pt: "melhoria", en: "improvement" }];
    const nivel5 = [
      { dialogo: "A: Hi! How are you?\nB: _____", correta: "I'm fine, thank you." },
      { dialogo: "A: What is your name?\nB: _____", correta: "My name is Anna." },
      { dialogo: "A: Do you speak English?\nB: _____", correta: "Yes, a little." },
      { dialogo: "A: Where are you from?\nB: _____", correta: "I'm from Brazil." }
    ];
    const nivel6 = [
      { pergunta: "A: What time is it?\nB: _____", resposta: "It is three o'clock" },
      { pergunta: "A: How old are you?\nB: _____", resposta: "I am 25 years old" },
      { pergunta: "A: What do you do?\nB: _____", resposta: "I am a student" }
    ];
    const nivel7 = [{ pt: "trabalho", en: "work" }, { pt: "dinheiro", en: "money" }, { pt: "escola", en: "school" }, { pt: "alimento", en: "food" }, { pt: "amigo", en: "friend" }, { pt: "cidade", en: "city" }, { pt: "viagem", en: "travel" }, { pt: "cultura", en: "culture" }];
    const nivel8 = [{ pt: "felicidade", en: "happiness" }, { pt: "tristeza", en: "sadness" }, { pt: "amor", en: "love" }, { pt: "medo", en: "fear" }, { pt: "coragem", en: "courage" }, { pt: "raiva", en: "anger" }, { pt: "paz", en: "peace" }, { pt: "respeito", en: "respect" }];
    const nivel9 = [
      { pergunta: "A: Can you help me?\nB: _____", resposta: "Yes, of course." },
      { pergunta: "A: Where is the bank?\nB: _____", resposta: "It is on Main Street." },
      { pergunta: "A: What is your favorite food?\nB: _____", resposta: "I love pizza." }
    ];
    const nivel10 = [
      { dialogo: "A: What are you doing tomorrow?\nB: _____", correta: "I'm going to the beach." },
      { dialogo: "A: Have you been to Paris?\nB: _____", correta: "Yes, once." },
      { dialogo: "A: Do you like music?\nB: _____", correta: "Yes, very much." }
    ];

    const niveis = { 1: nivel1, 2: nivel2, 3: nivel3, 4: [...nivel1, ...nivel2], 5: nivel5, 6: nivel6, 7: nivel7, 8: nivel8, 9: nivel9, 10: nivel10 };

    // --- ESTADO DO JOGO ---
    let moedas = parseInt(localStorage.getItem("moedas")) || 5;
    let nivel = parseInt(localStorage.getItem("nivel")) || 1;
    let pontuacao = parseInt(localStorage.getItem("pontuacao")) || 0;
    let vidas = 3;
    let palavrasRestantes = [];
    let palavraAtual;
    let historicoNivel = []; 

    function atualizarInterface() {
      document.getElementById("moedasDisplay").textContent = `🪙 Moedas: ${moedas}`;
      document.getElementById("scoreDisplay").textContent = `Pontos: ${pontuacao}`;
      document.getElementById("levelDisplay").textContent = `Nível: ${nivel}`;
      document.getElementById("vidasDisplay").textContent = "❤️ ".repeat(vidas) + "🤍 ".repeat(3-vidas);
      document.getElementById("btnDica").disabled = (moedas < 3);
      
      const mapa = document.getElementById("mapaNiveis");
      mapa.innerHTML = Array.from({length: 10}, (_, i) => (i+1 === nivel ? "🟢" : (i+1 < nivel ? "✅" : "🔒"))).join(" ");
      
      localStorage.setItem("moedas", moedas);
      localStorage.setItem("nivel", nivel);
      localStorage.setItem("pontuacao", pontuacao);
    }

    function novaPalavra() {
      const lista = niveis[nivel] || nivel1;
      if (palavrasRestantes.length === 0) {
        palavrasRestantes = [...lista];
        historicoNivel = [];
      }

      palavraAtual = palavrasRestantes.splice(Math.floor(Math.random() * palavrasRestantes.length), 1)[0];
      document.getElementById("feedbackDisplay").textContent = "";
      document.getElementById("optionsContainer").innerHTML = "";
      document.getElementById("btnDica").style.display = "block";
      
      // LOGICA DOS NIVEIS ORIGINAIS
      if (nivel === 5 || nivel === 10) {
        document.getElementById("wordDisplay").textContent = palavraAtual.dialogo;
        palavraAtual.esperada = palavraAtual.correta;
        gerarDialogoOpcoes();
      } else if (nivel === 6 || nivel === 9) {
        document.getElementById("wordDisplay").textContent = palavraAtual.pergunta;
        palavraAtual.esperada = palavraAtual.resposta;
        gerarInputManual();
      } else {
        let mostrar = (nivel === 2) ? "en" : "pt";
        if (nivel === 3) mostrar = Math.random() > 0.5 ? "en" : "pt";
        document.getElementById("wordDisplay").textContent = palavraAtual[mostrar] || palavraAtual.pt;
        palavraAtual.esperada = (mostrar === "pt") ? palavraAtual.en : (palavraAtual.pt || palavraAtual.en);
        
        if (nivel === 4) gerarInputManual();
        else gerarOpcoes(lista, (mostrar === "pt" ? "en" : "pt"));
      }
      atualizarInterface();
    }

    function gerarOpcoes(lista, idiomaOpcao) {
      const container = document.getElementById("optionsContainer");
      let opcoes = new Set([palavraAtual.esperada]);
      while(opcoes.size < 4) {
        let r = lista[Math.floor(Math.random()*lista.length)];
        let txt = r[idiomaOpcao] || (idiomaOpcao === "en" ? r.en : r.pt);
        if(txt) opcoes.add(txt);
      }
      Array.from(opcoes).sort(() => Math.random()-0.5).forEach(txt => {
        const btn = document.createElement("button");
        btn.textContent = txt;
        btn.onclick = () => verificarResposta(txt);
        container.appendChild(btn);
      });
    }

    function gerarDialogoOpcoes() {
      const container = document.getElementById("optionsContainer");
      const extras = ["I don't know.", "See you later.", "Nice to meet you."];
      let opcoes = [palavraAtual.correta, ...extras].sort(() => Math.random() - 0.5);
      opcoes.forEach(txt => {
        const btn = document.createElement("button"); btn.textContent = txt;
        btn.onclick = () => verificarResposta(txt);
        container.appendChild(btn);
      });
    }

    function gerarInputManual() {
      const container = document.getElementById("optionsContainer");
      container.innerHTML = `<input type="text" id="respostaInput" placeholder="Digite aqui..."><br>
                             <button onclick="verificarResposta(document.getElementById('respostaInput').value)">Verificar</button>`;
    }

    function verificarResposta(resposta) {
      if(!resposta) return;
      const correta = palavraAtual.esperada;
      const isCorreta = resposta.toLowerCase().trim() === correta.toLowerCase().trim();
      const questaoTexto = palavraAtual.pt || palavraAtual.dialogo || palavraAtual.pergunta;

      if (isCorreta) {
        moedas += 1; pontuacao += 10;
        document.getElementById("feedbackDisplay").textContent = "✅ Correto!";
        document.getElementById("feedbackDisplay").style.color = "#2ecc71";
        historicoNivel.push({ q: questaoTexto.substring(0,20) + "...", r: correta, status: "✅" });
      } else {
        vidas--;
        document.getElementById("feedbackDisplay").textContent = `❌ Errado! Era: ${correta}`;
        document.getElementById("feedbackDisplay").style.color = "#ff6b6b";
        document.getElementById("gameBox").classList.add("shake");
        historicoNivel.push({ q: questaoTexto.substring(0,20) + "...", r: correta, status: "❌" });
        setTimeout(() => document.getElementById("gameBox").classList.remove("shake"), 400);
      }

      setTimeout(() => {
        if (vidas <= 0) {
          alert("Fim de Jogo no Nível " + nivel + "! Tente novamente.");
          vidas = 3; palavrasRestantes = []; novaPalavra();
        } else if (palavrasRestantes.length === 0) {
          mostrarMenuFimNivel();
        } else {
          novaPalavra();
        }
      }, 1500);
    }

    function mostrarMenuFimNivel() {
      const modal = document.getElementById("modalResultados");
      const conteudo = document.getElementById("resumoConteudo");
      const infoFaltam = document.getElementById("infoFaltam");
      
      conteudo.innerHTML = "<strong>Relatório de Desempenho:</strong><br><br>";
      historicoNivel.forEach(item => {
        conteudo.innerHTML += `${item.status} ${item.q} -> <b>${item.r}</b><br>`;
      });

      infoFaltam.innerHTML = `Nível ${nivel} Concluído!<br>Faltam ${10 - nivel} níveis para o final.`;
      modal.style.display = "block";
    }

    function irParaProximoNivel() {
      document.getElementById("modalResultados").style.display = "none";
      nivel++;
      if (nivel > 10) {
        alert("PARABÉNS! VOCÊ COMPLETOU O JOGO!");
        resetarJogo();
      } else {
        vidas = 3; 
        palavrasRestantes = [];
        novaPalavra();
      }
    }

    function revelarResposta() {
      if (moedas >= 3) {
        moedas -= 3;
        alert("A resposta correta é: " + palavraAtual.esperada);
        atualizarInterface();
      }
    }

    function falarPalavra() {
      const txt = document.getElementById("wordDisplay").textContent;
      window.speechSynthesis.speak(new SpeechSynthesisUtterance(txt));
    }

    function resetarJogo() {
      localStorage.clear();
      location.reload();
    }

    window.onload = novaPalavra;
  </script>
</body>
</html>
